
name: Enterprise AI Platform CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_oracle:
        description: "Publish images and deploy to Oracle Cloud"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. VALIDATE APPLICATION AND RUN AUTOMATED TESTS
  # ============================================================

  validate:
    name: Validate and Test
    runs-on: ubuntu-latest

    # Test configuration only.
    # These are dummy URLs; production credentials are not used.
    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      # LLM configuration for test collection
      PORTKEY_API_KEY: ci-test-placeholder
      GROQ_MODEL: ci-test-groq-model
      OPENAI_MODEL: ci-test-openai-model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --group evaluation

      - name: Compile Python files
        run: uv run python -m compileall -q app evals ui tests

      - name: Run automated tests
        run: uv run python -m pytest -v tests


  # ============================================================
  # 2. BUILD AND PUBLISH DOCKER IMAGES TO GHCR
  # ============================================================

  docker-build:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: >
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/master') ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/master' &&
           inputs.deploy_oracle == true)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # API IMAGE
      # ----------------------------------------------------------

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: >
            ${{ (github.event_name == 'push' &&
                 github.ref == 'refs/heads/master') ||
                (github.event_name == 'workflow_dispatch' &&
                 github.ref == 'refs/heads/master' &&
                 inputs.deploy_oracle == true) }}
          tags: |
            ghcr.io/adith006/enterprise-ai-knowledge-platform-api:${{ github.sha }}
            ghcr.io/adith006/enterprise-ai-knowledge-platform-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ----------------------------------------------------------
      # STREAMLIT UI IMAGE
      # ----------------------------------------------------------

      - name: Build and publish UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          push: >
            ${{ (github.event_name == 'push' &&
                 github.ref == 'refs/heads/master') ||
                (github.event_name == 'workflow_dispatch' &&
                 github.ref == 'refs/heads/master' &&
                 inputs.deploy_oracle == true) }}
          tags: |
            ghcr.io/adith006/enterprise-ai-knowledge-platform-ui:${{ github.sha }}
            ghcr.io/adith006/enterprise-ai-knowledge-platform-ui:latest
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui


  # ============================================================
  # 3. DEPLOY TO ORACLE CLOUD
  # ============================================================

  deploy-oracle:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master' &&
       inputs.deploy_oracle == true)

    concurrency:
      group: oracle-production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          ORACLE_SSH_PRIVATE_KEY_B64: ${{ secrets.ORACLE_SSH_PRIVATE_KEY_B64 }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$ORACLE_SSH_PRIVATE_KEY_B64" \
            | base64 --decode > ~/.ssh/oracle_key

          sed -i 's/\r$//' ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

          printf '%s\n' "$ORACLE_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/oracle_key > /dev/null

      - name: Transfer production Compose configuration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/oracle_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            compose.yaml \
            "$ORACLE_USER@$ORACLE_HOST:/home/opc/compose.yaml.new"

      - name: Deploy application on Oracle Cloud
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/oracle_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$ORACLE_USER@$ORACLE_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'

          set -euo pipefail

          cd /home/opc

          # Activate the newly transferred Compose configuration
          mv compose.yaml.new compose.yaml

          # Pull the exact images built by this workflow
          sudo --preserve-env=IMAGE_TAG \
            docker compose -f compose.yaml pull api ui

          # Apply the updated deployment configuration
          sudo --preserve-env=IMAGE_TAG \
            docker compose -f compose.yaml up -d --remove-orphans

          # Display deployment status
          sudo docker compose -f compose.yaml ps

          REMOTE

      - name: Verify production API health
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              https://hr-policies-api.duckdns.org/health; then
              echo "Production API is healthy."
              exit 0
            fi

            echo "Health check attempt $attempt failed. Retrying..."
            sleep 10
          done

          echo "Production API health check failed."
          exit 1
