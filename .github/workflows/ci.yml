
name: Enterprise AI Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python and dependency validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install application dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q app

      - name: Install test tools
        run: uv pip install --python .venv/bin/python pytest

      - name: Run automated tests
        run: .venv/bin/python -m pytest -v tests

  docker-build:
    name: Build and publish Docker image
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/adith006/enterprise-ai-knowledge-platform-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Authenticate to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$CR_PAT" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish versioned image
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Publish latest image
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: docker push "${IMAGE_NAME}:latest"
