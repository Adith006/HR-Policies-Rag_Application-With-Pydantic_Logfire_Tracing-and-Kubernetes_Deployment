
name: Enterprise AI Platform CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python and dependency validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install application dependencies
        run: uv sync --frozen --no-dev --no-install-project --group evaluation

      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q app evals ui tests

      - name: Install test tools
        run: uv pip install --python .venv/bin/python pytest

      - name: Run automated tests
        run: .venv/bin/python -m pytest -v tests

  docker-build:
    name: Build and publish Docker images
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      API_IMAGE: ghcr.io/adith006/enterprise-ai-knowledge-platform-api
      UI_IMAGE: ghcr.io/adith006/enterprise-ai-knowledge-platform-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${API_IMAGE}:${GITHUB_SHA}" \
            --tag "${API_IMAGE}:latest" \
            .

      - name: Build Streamlit image
        run: |
          docker build \
            --file ui/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${UI_IMAGE}:${GITHUB_SHA}" \
            --tag "${UI_IMAGE}:latest" \
            .

      - name: Authenticate to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Publish API image
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          docker push "${API_IMAGE}:${GITHUB_SHA}"
          docker push "${API_IMAGE}:latest"

      - name: Publish Streamlit image
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          docker push "${UI_IMAGE}:${GITHUB_SHA}"
          docker push "${UI_IMAGE}:latest"

  deploy-oracle:
    name: Deploy to Oracle Cloud
    needs: docker-build
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy latest images to Oracle VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_PRIVATE_KEY_B64: ${{ secrets.ORACLE_SSH_PRIVATE_KEY_B64 }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/oracle_deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/oracle_known_hosts"

          trap 'rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE"' EXIT

          # Decode the Base64-encoded RSA private key
          printf '%s' "$ORACLE_SSH_PRIVATE_KEY_B64" | base64 --decode > "$KEY_FILE"

          # Normalize Windows line endings if present
          sed -i 's/\r$//' "$KEY_FILE"

          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"

          chmod 600 "$KEY_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          # Validate the decoded private key before connecting
          ssh-keygen -y -f "$KEY_FILE" > /dev/null

          # Connect to Oracle and deploy the latest images
          ssh \
            -i "$KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" \
            'set -e
             cd /home/opc
             sudo docker compose -f compose.yaml pull api ui
             sudo docker compose -f compose.yaml up -d --remove-orphans
             sudo docker compose -f compose.yaml ps'

      - name: Verify production HTTPS endpoint
        run: |
          set -euo pipefail

          API_URL="https://hr-policies-api.duckdns.org/docs"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$API_URL" -o /dev/null; then
              echo "Oracle deployment verified successfully."
              exit 0
            fi

            echo "Health check attempt $attempt failed. Retrying..."
            sleep 10
          done

          echo "Deployment health verification failed."
          exit 1
